name: Temporary Timetable Syntax Debug

on:
  push:
    branches: ["feature/asc-style-timetable-manager"]

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Capture syntax errors
        run: |
          set +e
          python -m compileall app > /tmp/compile.out 2>&1
          rc=$?
          cat /tmp/compile.out
          cp /tmp/compile.out syntax-debug.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add syntax-debug.txt
          git commit -m "Temporary timetable syntax diagnostic" || true
          git push origin HEAD:${GITHUB_REF_NAME} || true
          exit $rc
