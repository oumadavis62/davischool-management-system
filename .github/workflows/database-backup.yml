name: Database Backup

on:
  schedule:
    - cron: "30 1 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create compressed PostgreSQL backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          mkdir -p backups
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-acl > "backups/davischool-$(date -u +%Y-%m-%d).dump"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: davischool-database-backup-${{ github.run_number }}
          path: backups/*.dump
          retention-days: 90
