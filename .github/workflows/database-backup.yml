name: Database Backup

on:
  schedule:
    # Run every day at 01:30 UTC.
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create compressed PostgreSQL backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          mkdir -p backups
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-acl > "backups/davischool-$(date -u +%Y-%m-%dT%H-%M-%SZ).dump"

      - name: Verify backup archive
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          dump_file="$(find backups -type f -name '*.dump' -print -quit)"
          test -n "$dump_file"
          pg_restore --list "$dump_file" > /tmp/davischool-backup-contents.txt
          test -s /tmp/davischool-backup-contents.txt

      - name: Upload verified backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: davischool-database-backup-${{ github.run_number }}
          path: backups/*.dump
          retention-days: 90
