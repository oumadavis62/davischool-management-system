name: Python Validation

on:
  push:
    branches: ["main"]
    paths-ignore: ["SYNTAX_CHECK.txt"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Compile application and record result
        shell: bash
        run: |
          set +e
          python -m compileall -q app > /tmp/compile.out 2>&1
          rc=$?
          {
            echo "DaviSchool Python syntax validation"
            echo "Commit: $GITHUB_SHA"
            echo "Python: $(python --version)"
            echo "compileall exit code: $rc"
            cat /tmp/compile.out
          } > SYNTAX_CHECK.txt
          exit 0

      - name: Publish syntax result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SYNTAX_CHECK.txt
          git commit -m "Report Python syntax validation result" || exit 0
          git push
