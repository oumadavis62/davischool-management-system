name: DaviSchool CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app
      - name: Verify PostgreSQL compatibility layer
        run: |
          python - <<'PY'
          from app.db import translate_sql
          assert "BIGSERIAL PRIMARY KEY" in translate_sql("CREATE TABLE t (id INTEGER PRIMARY KEY, name TEXT)")
          assert translate_sql("SELECT * FROM t WHERE id=?") == "SELECT * FROM t WHERE id=%s"
          print("PostgreSQL compatibility checks passed")
          PY
