name: Fix school verification page
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix sqlite Row access in school management
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app/main.py")
          s = p.read_text()
          old = """users_by_school.get(s['id'],{}).get('email','') if users_by_school.get(s['id']) else ''"""
          new = """users_by_school[s['id']]['email'] if s['id'] in users_by_school else ''"""
          if old not in s:
              raise SystemExit("target expression not found")
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-school-verification.yml
          git add app/main.py .github/workflows/fix-school-verification.yml
          git diff --cached --quiet || git commit -m "Fix school verification success redirect"
          git push
