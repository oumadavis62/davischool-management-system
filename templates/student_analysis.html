{% extends 'base.html' %}{% block content %}<form class=form method=get><select name=student_id>{% for s in students %}<option value={{s.id}} {% if student and s.id==student.id %}selected{% endif %}>{{s.admission_no}} — {{s.first_name}} {{s.last_name}}</option>{% endfor %}</select><button>Analyse</button></form><div class=panel><h2>{{student.first_name if student else ''}} {{student.last_name if student else ''}}</h2><table><tr><th>Assessment</th><th>Percent</th><th>Grade</th><th>Remark</th></tr>{% for x in rows %}<tr><td>{{x.assessment}}</td><td>{{x.percent}}%</td><td>{{x.grade}}</td><td>{{x.remark}}</td></tr>{% endfor %}</table></div>{% endblock %}
