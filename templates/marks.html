{% extends 'base.html' %}{% block content %}<form class=form method=get><select name=assessment_id>{% for a in assessments %}<option value={{a.id}} {% if a.id==assessment.id %}selected{% endif %}>{{a.name}} (ID {{a.id}})</option>{% endfor %}</select><button>Load</button></form><form method=post action=/marks/save><input type=hidden name=assessment_id value={{assessment.id}}><div class=panel><h2>{{assessment.name}} — max {{assessment.max_marks}}</h2><table><tr><th>Student</th><th>Admission</th><th>Marks</th></tr>{% for s,m in rows %}<tr><td>{{s.first_name}} {{s.last_name}}</td><td>{{s.admission_no}}</td><td><input name=s_{{s.id}} type=number step=.01 min=0 max={{assessment.max_marks}} value='{{m.marks if m else ""}}'></td></tr>{% endfor %}</table><button>Save marks</button></div></form>{% endblock %}
