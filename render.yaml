services:
  - type: web
    name: davischool-management-system
    runtime: python
    rootDir: .
    autoDeploy: true
    healthCheckPath: /
    buildCommand: ./build.sh
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-2}
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: davischool-db
          property: connectionString
      - key: DAVISCHOOL_SECRET_KEY
        generateValue: true
      - key: DAVISCHOOL_HTTPS_ONLY
        value: "1"
      - key: DAVISCHOOL_SUPER_ADMIN
        value: "admin@davischool.com"
      - key: DAVISCHOOL_SUPER_ADMIN_PASSWORD
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"

databases:
  - name: davischool-db
    databaseName: davischool
    user: davischool
