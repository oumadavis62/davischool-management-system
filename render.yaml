services:
  - type: web
    name: davischool-management-system
    runtime: python
    autoDeploy: true
    healthCheckPath: /
    buildCommand: ./build.sh
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-2}
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: davischool-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_HTTPS
        value: "1"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SCHOOL_NAME
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"

databases:
  - name: davischool-db
    databaseName: davischool
    user: davischool
